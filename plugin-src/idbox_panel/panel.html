<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ID BOX</title>
<!--
  ID BOX · SketchUp 面板（本地文件，由 UI::HtmlDialog 的 set_file 加载）

  硬约束（改这个文件时不得放开，docs/39 §4.1）：
    - 零网络：不发起任何网络请求，不用 CDN、远程资源、外部字体或图片。
      所有样式与脚本都内联在这一个文件里；图片只允许 base64 内联或本地路径拼接。
    - 零上报：不打点、不上报、不联网。
    - 本地存储只有**一处**：`localStorage['idbox.panel.density']` 记住「大/中/小」预览档
      （2026-11-09 用户要求，面板里唯一允许的持久化；**绝不写盘文件**，也绝不写 ID BOX 数据）。
    - 搜索与筛选纯前端：只在内存里过滤 Ruby 推下来的记录。
    - 只读：面板从不调用任何写文件的 Ruby 回调（Ruby 侧也没有这样的回调）。
    - 单一主题（2026-11-10 用户拍板 D01，防回潮）：本插件只提供浅色，**禁止**新增
      按系统深色偏好的媒体查询覆盖、主题属性、主题切换或任何主题持久化；
      系统为深色时本页仍按浅色渲染。若将来要支持深色，须先经用户重新拍板并
      单独立卡，不得直接加深色媒体查询覆盖（见 `:root` 注释的同款声明）。

  与 Ruby 的契约（add_action_callback，只增不删）：
    sketchup.ready()                → 面板就绪，请求数据
    sketchup.refreshIndex()         → 强制重读索引文件（新增调用点：提示条）
    sketchup.insertRecord(id)       → 插入一条记录（新增调用点：卡片双击）
    sketchup.applyMaterial(id)      → 双击材质：建材质 + 设当前材质（**不贴面**，V1.0）
    sketchup.setPanelSize(flag)     → 折叠 / 展开窗口（flag = true 折叠），调 dialog.set_size
    sketchup.closePanel()           → 关闭面板，调 dialog.close
      （页面侧暂无入口，Ruby 侧能力保留：自绘「关闭」按钮已按 2026-11-09 B′ 删除，
        原 JS 桥 window.sketchup.closePanel() 及其死函数已按 2026-11-10 D09 清掉；
        菜单 / 工具栏关闭走 Ruby 的 close，A8「回调契约只增不删」故 Ruby 注册保留。
        勿据「页面没有入口」删此注册或本行契约。）
  Ruby 侧调用（execute_script）：
    window.IDBOX.render(payload)    → 渲染整份数据（payload 只增字段：thumbsRoot、materialKinds）
    window.IDBOX.setStatus(obj)     → 底部状态行 { message, level }

  必须保留的 11 个 DOM id：
    banner clear count empty fresh list notes q refresh status ver
  假控件去留（2026-11-10 用户拍板，docs/51 §8.0）：
    - D02：左栏底部整块 CTA（按钮形态 + 加号图标 + 说明文字 + title）已整块删除；
      不留静态灰字提示、不改成真按钮，面板侧零新接口。别再加回来。
    - D03：版本行里的齿轮图标已删，只留纯文字版本号 + 一行静态说明；
      整行无 cursor:pointer / accent 底 / 按钮语义 / 悬浮提示，也不做「关于 / 诊断」浮层。
  本版新增（不计入 11 个）：win-fold（折叠）。自绘的「关闭」按钮已被用户拍板删除
  （2026-11-09 B′：它与系统标题栏的 × 完全重复，留着就是"两排按钮打架"）——别再加回来。

  窗口控件说明（docs/48 §6 + 2026-11-09 B′ 拍板）：只保留**自绘「折叠」**一个按钮，
  放在顶栏左侧（logo 右侧），与右上的系统按钮在空间上彻底错开；**不做最大化**
  （HtmlDialog 没有真正的最大化语义）、**不做伪置顶**（无官方 API）。
  折叠 = 整个窗口收成一条窄栏（高度由 Ruby 侧 set_size 收到 60px），不是「只把内容藏起来」。
  关闭只有两条路，都不经过自绘按钮：系统标题栏的 ×、以及菜单/工具栏里的关闭
  （两条都走 Ruby 的 close → set_on_closed → stop_polling）。

  物理尺寸口径：960×680 / 最小 760×520（CSS 承担下限，见 body）。
  折叠态例外：html/body 的 min-width / min-height 在 .is-collapsed 下放开（否则收不成窄栏）。

  缩略图结论（2026-11-09 实测，可对外解释）：路径拼装与缩略图文件本身**都没有问题**
  —— 用真实索引在 Chromium 里渲染本页，102/102 张封面全部加载成功（broken 0）。
  用户那台机器"没有缩略图"的唯一成因是 payload 的 thumbsRoot 为空（旧插件包
  `Snapshot#thumbs_root` 恒返回空串）⇒ 本页按设计降级为类型图标。1.1.1 已修该根因；
  renderNotes 也会把「缩略图根未下发」明写出来，不再是一片图标让人猜。
-->
<style>
  /* ══ 语义覆盖集 S（34 变量）· 唯一变量源（本插件只提供浅色）══════════════════
     A 底色/描边 12 · B 文字四档 4 · C 强调/tint 6 · D 状态色 5
     E 品牌格式徽标 6（取代退役的 --tag-*）· F 阴影 3
     S5：--bg-active-nav 是与 --accent-tint 同值的别名（选中态导航底色）。
     本 :root 是**唯一变量源**；不存在深色覆盖集。若将来要支持深色，须先经用户
     重新拍板并单独立卡，禁止新增深色媒体查询覆盖、主题属性、主题切换或任何
     主题持久化（2026-11-10 用户拍板 D01 / D12；同款声明见文件头硬约束清单）。
  ═════════════════════════════════════════════════════════════════════════ */
  :root {
    /* A · 底色 / 描边（12） */
    --bg-canvas: #f8fafc;
    --bg-sidebar: #f1f5f9;
    --bg-elevated: #e2e8f0;
    --surface-card: #ffffff;
    --bg-active-nav: #e1efff;            /* S5 别名（与 --accent-tint 同值） */
    --panel-bg: #ffffff;
    --border: #e2e8f0;
    --border-panel: #e8edf2;
    --border-soft: #eef1f4;
    --pill-bg: #f1f5f9;
    --toast-bg: #f8fafc;
    --bg-floatbar: #ffffff;

    /* B · 文字四档（4） */
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
    --text-tertiary: #6b7280;
    --text-muted: #9ca3af;

    /* C · 强调 / tint / 分段控件（6） */
    --accent: #007aff;
    --accent-text: #007aff;
    --accent-tint: #e1efff;
    --tint-neutral: #eef1f4;
    --tint-neutral-text: #4b5563;
    --seg-active: #ffffff;

    /* D · 状态色（5） */
    --danger: #e5484d;
    --danger-tint: #fef1f0;
    --success: #30a46c;
    --preview: #7a5af8;
    --preview-tint: #efe9fe;

    /* E · 品牌格式徽标（6，取代 --tag-*） */
    --brand-su-bg: #fde7e7;
    --brand-su-text: #c43c3c;
    --brand-max-bg: #e3f2f8;
    --brand-max-text: #16708f;
    --brand-cad-bg: #fde7ef;
    --brand-cad-text: #c00d43;

    /* F · 阴影（3） */
    --shadow-card: 0 8px 24px rgba(100,116,139,.10);
    --shadow-card-hover: 0 12px 28px rgba(100,116,139,.16);
    --shadow-card-active: 0 8px 24px rgba(0,122,255,.15);

    /* 字号八级（portable-spec §2.2） */
    --fs-page-title: 17px;
    --fs-modal-title: 16px;
    --fs-section: 14px;
    --fs-card-title: 13px;
    --fs-card-name: 12px;
    --fs-body: 12px;
    --fs-caption: 11px;
    --fs-micro: 10px;

    /* 圆角 / 间距（唯一档，portable-spec §3.2；本插件只提供浅色，见文件头 D01） */
    --radius-card: 16px;
    --radius-nav: 9px;
    --radius-chip: 6px;
    --radius-badge: 4px;
    --radius-search: 10px;
    --radius-logo: 6px;
    --radius-seg: 6px;
    --radius-seg-group: 10px;
    --radius-pill: 999px;
    --radius-pill-header: 9px;
    --radius-toast: 8px;
    --radius-toast-undo: 8px;
    --radius-toast-undo-inner: 6px;
    --radius-cover: 12px;
    --gap-card: 14px;

    /* 系统字体栈（不引字体文件） */
    --font-ui: -apple-system,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    min-width: 760px; min-height: 520px;      /* 物理下限（CSS 承担） */
    background: var(--bg-canvas); color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: var(--fs-body); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* ── 图标精灵表（24×24 网格、图形占 20×20、stroke-width 2.25 → 16px 视觉 1.5）── */
  .sprite { display: none; }
  .icon { width: 16px; height: 16px; flex: 0 0 auto; display: block; }
  .icon-nav { width: 15px; height: 15px; }
  .icon-10 { width: 10px; height: 10px; }
  .icon-40 { width: 40px; height: 40px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ══ ① 顶栏 56px ═════════════════════════════════════════════════════════ */
  .topbar {
    flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--bg-canvas); border-bottom: 1px solid var(--border-panel);
  }
  /* 插件自己的 Logo（不是主程序 Logo）：取 assets/toolbar.svg 的图形做**单色内联版**，
     不新增位图、不引用外部文件（零外链约束）。颜色走 token，随主题变。 */
  .logo {
    width: 24px; height: 24px; flex: 0 0 auto; border-radius: var(--radius-logo);
    background: var(--accent-tint); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-svg { width: 18px; height: 18px; display: block; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .04em; color: var(--text-primary); flex: 0 0 auto; }
  .brand .ver { margin-left: 6px; }
  .search-wrap { position: relative; display: flex; align-items: center; flex: 1 1 auto; min-width: 180px; }
  .search-wrap .icon { position: absolute; left: 9px; color: var(--text-tertiary); }
  .search {
    width: 100%; height: 32px; padding: 0 26px 0 30px;
    border: 1px solid var(--border); border-radius: var(--radius-search);
    background: var(--pill-bg); color: var(--text-primary);
    font-size: var(--fs-body); font-family: inherit; outline: none;
  }
  .search:focus { border-color: var(--accent); background: var(--bg-elevated); }
  .clear {
    position: absolute; right: 8px; border: none; background: transparent;
    color: var(--text-tertiary); cursor: pointer; padding: 2px; display: flex; align-items: center;
    font-family: inherit;
  }
  .clear:hover { color: var(--text-primary); }

  .seg { display: flex; align-items: center; gap: 2px; padding: 2px; background: var(--pill-bg); border-radius: var(--radius-seg-group); }
  .seg-btn {
    display: flex; align-items: center; justify-content: center; width: 28px; height: 24px;
    border: none; border-radius: var(--radius-seg); background: transparent;
    color: var(--text-tertiary); cursor: pointer; font-family: inherit; padding: 0;
  }
  .seg-btn:hover { color: var(--text-primary); }
  .seg-btn.is-active { background: var(--seg-active); color: var(--accent-text); }
  /* ── 预览密度（大 / 中 / 小）────────────────────────────────────────────
     2026-11-09 修：这里原来是一个纯文本 <span>（title 里就写着"本批不接行为"）——
     用户点不动**不是被遮挡，而是它从来不是按钮**。现在改成与顶栏 .seg 同构的
     分段控件（同一套 token），三档只切 body 上的 density-* class，
     CSS 变量 --grid-cols 决定列数，卡片 markup / 渲染逻辑都不变。 */
  .density {
    display: flex; align-items: center; gap: 2px; padding: 2px;
    background: var(--pill-bg); border-radius: var(--radius-seg-group); flex: 0 0 auto;
  }
  .density-btn {
    display: flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px; border: none;
    border-radius: var(--radius-seg); background: transparent;
    color: var(--text-tertiary); cursor: pointer; font-family: inherit;
    font-size: var(--fs-caption); letter-spacing: .06em; line-height: 1;
  }
  .density-btn:hover { color: var(--text-primary); }
  .density-btn.is-active { background: var(--seg-active); color: var(--accent-text); }
  .density-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 顶栏右侧是「新鲜度 + 刷新」，窄窗口时不能让它们被挤出可视区：
     .status-area 允许收缩、.fresh 允许缩到省略号（原来两者都是 0 0 auto，760px 下会溢出）。 */
  .status-area { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
  .fresh { flex: 0 1 auto; min-width: 0; font-size: var(--fs-caption); color: var(--text-muted); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fresh.stale { color: var(--text-secondary); }
  .ver { font-size: var(--fs-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ── 自绘窗口控件：只剩「折叠」一个（2026-11-09 用户拍板 B′）───────────────
     为什么搬到顶栏**左侧**：右上是系统标题栏的最小化/最大化/关闭，自绘按钮原来贴在
     它们正下方，视觉上就是"两排按钮打架"。搬到 logo 右侧后两套控件在空间上彻底错开。
     为什么删掉自绘「关闭」：它与系统标题栏的 × **完全重复**（同样走 dialog.close →
     set_on_closed → stop_polling），留着只增加歧义。
     视觉：辅助控件——默认 --text-tertiary，hover 才提亮，**不抢「刷新」的注意力**。 */
  .win-controls { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
  .win-btn {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius-chip); background: transparent;
    color: var(--text-tertiary); cursor: pointer; padding: 0; font-family: inherit;
  }
  .win-btn .icon { width: 12px; height: 12px; }
  .win-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

  /* ── 折叠态：整个窗口收成一条窄栏（窗口高度由 Ruby set_size 收到 60px）──────
     只留「logo + 折叠（此时是展开）+ 品牌 + 版本」；其余块全部不渲染。
     注意 html 上的 min-width / min-height 也必须放开，否则窗口收不下去（min-width 760）。 */
  html.is-collapsed, body.is-collapsed { min-width: 0; min-height: 0; }
  body.is-collapsed .topbar { border-bottom: none; }
  body.is-collapsed .search-wrap,
  body.is-collapsed .seg,
  body.is-collapsed .density,
  body.is-collapsed .status-area,
  body.is-collapsed .banner,
  body.is-collapsed #notes,
  body.is-collapsed .shell,
  body.is-collapsed .statusbar { display: none !important; }
  /* 折叠态下「折叠」按钮换成「展开」图标（JS 换 use 的 href，CSS 只管留位） */

  /* ══ 提示条（P1-2）：≤ 单行可点击 ═════════════════════════════════════════
     ⚠️ 2026-11-09 修：这里原来写的是 `display: none`，而 renderBanner 显示时给的是
     `class="banner warn"` / `"banner error"`（**不含** hidden），两个变体又都没重设 display
     ⇒ 提示条**永远不可见**（IDBOX-101、只读态、写入侧报错三条全部哑掉）。
     现在改成 `display: flex`，隐藏改由 `.hidden`（renderBanner 无条件先加）负责。 */
  .banner {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; font-size: var(--fs-caption); cursor: pointer;
    border-bottom: 1px solid var(--border-panel); background: var(--danger-tint); color: var(--danger);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .banner .banner-code { font-weight: 600; flex: 0 0 auto; }
  .banner.warn { background: var(--pill-bg); color: var(--text-secondary); }
  .banner.error { background: var(--danger-tint); color: var(--danger); }

  #notes { flex: 0 0 auto; padding: 0 14px; }
  .note { font-size: var(--fs-micro); color: var(--text-muted); padding: 4px 0 0; white-space: pre-wrap; }
  /* 需要用户动手处理 / 会改变观感的说明（如 thumbsRoot 未下发导致封面全降级）：
     比普通 note 亮一档，但不占用 danger 色（那留给真正的错误）。 */
  .note-warn { color: var(--text-secondary); font-weight: 500; }

  /* ══ 主体两列 ═════════════════════════════════════════════════════════════ */
  .shell { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ── ② 左栏 216px ── */
  .side { flex: 0 0 216px; width: 216px; display: flex; flex-direction: column; background: var(--bg-sidebar); border-right: 1px solid var(--border); }
  .side-scroll { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 8px; }
  .group-head { font-size: var(--fs-caption); font-weight: 500; letter-spacing: .08em; color: var(--text-muted); padding: 10px 4px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px;
    border-radius: var(--radius-nav); cursor: pointer; color: var(--text-secondary);
    font-size: var(--fs-card-title);
  }
  .nav-item .icon { color: var(--text-tertiary); }
  .nav-item .nav-count { margin-left: auto; font-size: var(--fs-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .nav-item:hover { background: var(--bg-elevated); }
  .nav-item.is-active { background: var(--bg-active-nav); color: var(--accent-text); }
  .nav-item.is-active .icon { color: var(--accent-text); }
  .nav-tree { margin-top: 6px; }
  .tree-item {
    display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
    border-radius: var(--radius-nav); cursor: pointer; color: var(--text-secondary); font-size: var(--fs-body);
  }
  .tree-item .icon { color: var(--text-tertiary); }
  .tree-item .nav-count { margin-left: auto; font-size: var(--fs-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .tree-item:hover { background: var(--bg-elevated); }
  .tree-item.is-active { background: var(--bg-active-nav); color: var(--accent-text); }
  /* T03 三级树（docs/51 §3.5 渐进披露）：二级行缩进一档，箭头走既有 --text-tertiary，不新造颜色。
     --fs-caption 是既有字号档（见 :root 字号八级），与主软件 caption 档一致。 */
  .tree-item-l2 { padding-left: 26px; font-size: var(--fs-caption); }
  .tree-caret { margin-left: auto; color: var(--text-tertiary); }
  .side-foot { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 10px 12px; }
  .side-meta { margin-top: 8px; font-size: var(--fs-micro); color: var(--text-muted); }
  .side-meta .lib-path { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 版本行 + 设置指路：纯静态文字（2026-11-10 D03）。无 cursor:pointer、无 accent 底、
     无按钮语义、无 title 悬浮提示 —— 整行不做任何「看起来能点」的外观，也不做只读浮层。 */
  .side-settings { margin-top: 6px; display: block; font-size: var(--fs-caption); color: var(--text-tertiary); }
  .side-settings-hint { margin-top: 2px; display: block; font-size: var(--fs-micro); color: var(--text-muted); }

  /* ── ③ 筛选 chips ── */
  .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .chips { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: var(--radius-chip);
    background: var(--bg-canvas); color: var(--text-secondary);
    font-size: var(--fs-body); font-family: inherit; cursor: pointer;
  }
  .chip-ghost { background: transparent; color: var(--text-tertiary); }
  .chip:hover { border-color: var(--accent); }
  .chip.is-active, .chip-accent { background: var(--accent-tint); color: var(--accent-text); border-color: transparent; }
  .chip .caret { font-size: var(--fs-micro); color: inherit; }
  .header-count { margin-left: auto; font-size: var(--fs-body); color: var(--text-tertiary); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── ④ 卡片网格 ── */
  .grid {
    flex: 1 1 auto; overflow-y: auto; padding: 10px 14px 12px;
    display: grid; grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, 1fr)); gap: var(--gap-card);
    align-content: start;
  }
  /* 预览密度三档：大 2 列 / 中 3 列 / 小 4 列。
     列数写死 + minmax(0,1fr) ⇒ 任何窗口宽度下都不会横向溢出，也不会出现半列空位。
     ⚠️ 单列视图（.view-list）在自己的规则里覆盖列数，不受这三档影响。 */
  body.density-lg { --grid-cols: 2; }
  body.density-md { --grid-cols: 3; }
  body.density-sm { --grid-cols: 4; }
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface-card); border: 1px solid transparent;
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    cursor: pointer; transition: transform 150ms ease-out, box-shadow 150ms ease-out, background-color 150ms ease-out;
  }
  .card:not(.is-selected):hover { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); }
  .card.is-selected { outline: 2px solid var(--accent); box-shadow: var(--shadow-card-active); }
  .card.is-disabled { cursor: default; opacity: .62; }
  .card-cover-frame { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-cover); background: var(--bg-canvas); overflow: hidden; }
  .card-cover { display: block; width: 100%; height: 100%; object-fit: contain; }
  .card-cover.is-hidden { display: none; }
  .card-ph { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--text-tertiary); }
  .card-ph.is-on { display: flex; }
  .badge {
    position: absolute; left: 6px; top: 6px; padding: 1px 6px;
    border-radius: var(--radius-badge); background: var(--tint-neutral); color: var(--tint-neutral-text);
    font-size: var(--fs-micro); font-weight: 500;
  }
  .card.is-selected .badge { background: var(--accent-tint); color: var(--accent-text); }
  .check-badge {
    position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; display: none;
    align-items: center; justify-content: center; border-radius: var(--radius-pill);
    background: var(--accent); border: 2px solid #fff; color: #fff;   /* S4 豁免：白描边 */
  }
  .card.is-selected .check-badge { display: flex; }
  .card-body { padding: 8px 10px 10px; min-width: 0; }
  .card-name { font-size: var(--fs-card-name); font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { margin-top: 3px; font-size: var(--fs-caption); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── ⑤ 空态两态（图形与 DOM 各自不同） ── */
  /* 默认可见；隐藏只靠 .hidden（JS 置 className = 'empty' / 'empty hidden'，与原实现一致） */
  .empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 26px 20px; color: var(--text-tertiary); }
  .empty .empty-text { font-size: var(--fs-body); text-align: center; white-space: pre-wrap; }
  .empty .empty-lead { font-size: var(--fs-section); font-weight: 600; color: var(--text-secondary); }

  /* ── ⑥ 底部状态栏 44px（文档流真实行，非浮层） ── */
  .statusbar {
    flex: 0 0 44px; height: 44px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; background: var(--toast-bg); border-top: 1px solid var(--border-panel);
  }
  .status-mark {
    flex: 0 0 16px; width: 16px; height: 16px; border-radius: var(--radius-pill);
    background: var(--success); color: #fff;   /* S4 豁免：白描边 */
    display: flex; align-items: center; justify-content: center;
  }
  .status { flex: 1 1 auto; min-width: 0; font-size: var(--fs-card-name); color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.ok { color: var(--success); }
  .status.error { color: var(--danger); }
  .status.warn, .status.info { color: var(--text-secondary); }
  /* 撤销胶囊（三态，docs/46 §1.6）：平时隐藏 / 插入成功显示 5 s / 到时自动收起。
     显隐刻意**不用 display:none**：硬切没法配 transition，而 display 变化会让 44px 状态行
     在显示-收起时抖一下。用 opacity + visibility（后者延迟到透明结束再切，收起才看得见淡出），
     尺寸保持不动 ⇒ 显隐不引起任何布局位移。隐藏态同时脱离无障碍树（visibility:hidden 的副作用，正好）。 */
  .undo-pill {
    flex: 0 0 auto; display: flex; align-items: center; height: 28px; padding: 0 10px;
    border-radius: var(--radius-toast-undo); background: var(--accent-tint);
    opacity: 1; visibility: visible;
    transition: opacity 150ms ease-out, visibility 0s linear 0s;
  }
  .undo-pill.is-hidden {
    opacity: 0; visibility: hidden;
    transition: opacity 150ms ease-out, visibility 0s linear 150ms;
  }
  /* 减少动效：不做过渡，直接显 / 隐（用户明确要求减少动画时的口径） */
  @media (prefers-reduced-motion: reduce) {
    .undo-pill, .undo-pill.is-hidden { transition: none; }
  }
  .undo-inner {
    display: flex; align-items: center; height: 20px; padding: 0 8px;
    border-radius: var(--radius-toast-undo-inner); background: var(--accent); color: #fff;  /* S4 豁免：白描边 */
    font-size: var(--fs-caption); font-weight: 600;
  }

  .hidden { display: none !important; }
  .view-list { grid-template-columns: minmax(0, 1fr); }
  .view-list .card { flex-direction: row; align-items: center; }
  .view-list .card-cover-frame { width: 92px; flex: 0 0 92px; }
  .view-list .card-body { padding: 8px 12px; }
</style>
</head>

<!-- 图标模板：JS 用 cloneNode 复制（不用 createElementNS，避免在文件里出现命名空间 URL） -->

<div class="app">

  <!-- ① 顶栏 56px -->
  <header class="topbar">
    <!-- 插件自己的 Logo：assets/toolbar.svg 图形的单色内联版（ID 字标），不引外链、不引位图 -->

      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.2 9.8V17.4"/>
        <path d="M11.6 6.6V17.4"/>
        <path d="M11.6 6.6h2.4a2.2 2.2 0 010 4.4h-2.4"/>
        <path d="M11.6 11h2.6a3.2 3.2 0 010 6.4h-2.6"/>
        <circle cx="7.2" cy="6.6" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <!-- 折叠（辅助控件，2026-11-09 B′：放 logo 右侧，与右上的系统按钮错开；
         自绘「关闭」已删——系统标题栏的 × 与它 100% 重复） -->
    <div class="win-controls">
      <button id="win-fold" class="win-btn" type="button" title="折叠为窄条（省屏幕空间）" aria-label="折叠面板">
        <svg class="icon" aria-hidden="true"><use href="#i-collapse"></use></svg>
      </button>
    </div>
    <div class="brand">ID BOX<span id="ver" class="ver"></span></div>
    <div class="search-wrap">
      <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="q" class="search" type="text" placeholder="搜索名称 / 分类…" autocomplete="off" spellcheck="false">
      <button id="clear" class="clear hidden" type="button" title="清空搜索">
        <svg class="icon icon-10" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>
    <div class="seg" role="group" aria-label="视图">
      <button class="seg-btn is-active" type="button" data-view="grid" title="网格视图">
        <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg>
      </button>
      <button class="seg-btn" type="button" data-view="list" title="列表视图（单列）">

<script>
(function () {
  'use strict';

  /* 撤销胶囊的计时器与时长（docs/46 §1.6.2）：
     - 计时器放在 IIFE 闭包内，不挂 window、不用全局变量（与 Ruby 侧「无全局变量」同款纪律）；
     - 只此一个变量 ⇒ 天然覆盖式：每次重新起计都先 clearTimeout，不会叠出第二个计时器/第二颗胶囊
       （DOM 里也只有一个 #undo，不 new 节点）。 */
  var undoTimer = null;
  var UNDO_PILL_MS = 5000;

  var state = {
    data: null,
    query: '',
    kindLabels: {},
    insertableKinds: ['model'],
    materialKinds: ['texture', 'material'],
    unsupportedHint: '',
    selectedId: '',        /* 单值，不是数组（§5.2 裁定 2） */
    activeKind: '',        /* '' = 全部；展示分组见 KIND_GROUPS */
    activeCategory1: '',
    activeCategory2: '',   /* 二级分类；'' = 不筛选 */
    expandedL1: '',        /* 当前展开了哪个一级的二级树；'' = 都不展开 */
    sortKey: 'default',
    thumbsRoot: '',        /* 来自 payload（T04 才落字段），本卡默认空 ⇒ 首屏全 SVG 占位 */
    viewMode: 'grid',
    density: 'md',         /* 预览密度 lg/md/sm（= 网格 2/3/4 列，localStorage 记忆） */
    collapsed: false,      /* 自绘窗口控件的折叠态（只影响本页面样式 + 通知 Ruby 改窗口尺寸） */
    thumbFail: 0,          /* 本轮渲染里封面加载失败的张数（只用于合并上报，见 noteThumbFailure） */
    thumbFailFirst: ''     /* 首张失败的 src —— 分流「file:// 被 CEF 拦 / 文件不存在」的关键证据 */
  };

  /* ══ 显示范围白名单（V1.0，docs/48 §6 拍板）═════════════════════════════════
     HDR / CAD / D5A 本版**不显示**（不是置灰，是完全不出现）。
     要放开某一类：把它加进这个数组即可 —— 左栏分组、筛选、计数、卡片列表
     全部由它派生（allowedGroups() / matches()），不需要再改别处。
     `other` 同样不在白名单里：面板只做「模型 + 材质」两件事。 */
  var ALLOWED_KINDS = ['model', 'texture', 'material'];

  /* 可「双击创建材质」的 kind。Ruby 是权威（core.rb 的 MATERIAL_KINDS），
     这里只是默认值；payload 带 materialKinds 时以 Ruby 为准。 */
  var MATERIAL_KINDS = ['texture', 'material'];

  /* 左栏展示分组 → KINDS 6 值（「材质 = texture + material」，§10.2 风险 8 建议口径）。
     分组表保留全部 6 类，实际显示哪些由 ALLOWED_KINDS 派生 ——
     这样「放开 HDR」只需改上面一行，不用回来动这里。
     all: true 的那一项是**聚合项**（「全部」），只用于展示与筛选复位，
     **不参与 groupOf 归类**（否则每条记录都会先命中它，导致 模型/材质 计数恒为 0）。 */
  var KIND_GROUPS = [
    { key: '', label: '全部', icon: 'i-grid', all: true, kinds: ['model', 'texture', 'material', 'hdri', 'cad', 'other'] },
    { key: 'model', label: '模型', icon: 'i-box', kinds: ['model'] },
    { key: 'material', label: '材质', icon: 'i-material', kinds: ['texture', 'material'] },
    { key: 'hdri', label: 'HDR', icon: 'i-hdr', kinds: ['hdri'] },
    { key: 'cad', label: 'CAD', icon: 'i-cad', kinds: ['cad'] },
    { key: 'other', label: '其他', icon: 'i-other', kinds: ['other'] }
  ];

  var SORT_KEYS = ['default', 'name', 'category1', 'fileCount'];
  var SORT_LABELS = { default: '默认排序', name: '按名称', category1: '按分类', fileCount: '按文件数' };

  /* 一级分类里「没有 category1」那一档的显示名。
     口径对齐 ID BOX 本体（logic/category.ts::countLevel1）：按 category1 分组计数，
     空值归入「未分类」，且**未分类恒排最后**。 */
  var UNCLASSIFIED_LABEL = '未分类';

  function $(id) { return document.getElementById(id); }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function textOf(value) {
    return (value === undefined || value === null) ? '' : String(value);
  }

  /* 「未分类」的统一判据：空串 / null / 字面「未分类」都算未分类。
     ⚠️ 必须用它判定，不要各写各的 —— 索引里的空分类是字符串 '未分类' 而不是 null。 */
  function isUnclassified(value) {
    var text = textOf(value).trim();
    return text === '' || text === UNCLASSIFIED_LABEL;
  }

  function hasSketchupCallback(name) {
    return !!(window.sketchup && typeof window.sketchup[name] === 'function');
  }

  /* ── 显示范围（唯一开关 = ALLOWED_KINDS + 模型主文件扩展名白名单）──────────
     ⚠️ 两层，别合并：
       · kind 层：model / texture / material（HDR / CAD / other 本版完全不显示）；
       · **主文件扩展名层**：kind = model 的还必须是 SketchUp 能打开的格式。
         `.skp` 与 `.max` 在索引里的 kind **都是 model**（主程序 EXT_KIND 两者都映射 model，
         也都落在「模型」目录），只按 kind 过滤会把 3ds Max 文件放进 SketchUp 插件
         （2026-11-09 用户实测：「3DMAX 的文件也会出现在 SketchUp 的插件里面」）。
         判据写成**白名单**（只放行 .skp）而不是黑名单 .max：将来真要支持别的格式，
         只改 MODEL_MAIN_EXTS 这一处即可。 */
  function isAllowedKind(kind) {
    return ALLOWED_KINDS.indexOf(textOf(kind)) >= 0;
  }

  /* kind = model 时允许显示的主文件扩展名（小写、不带点）。**白名单**：只放 .skp。 */
  var MODEL_MAIN_EXTS = ['skp'];

  /* 取主文件扩展名（小写、不带点）。
     数据来源 = payload 记录的 mainFile 字段（Ruby 侧 Snapshot#normalize_record 已经给了它，
     panel 的插入前置校验也在用它）——**不要**拿 files[0] 盲取，文件顺序不保证。
     兼容 Windows 反斜杠与形如 "a/b/c.skp" 的相对路径；没有扩展名返回 ''。 */
  function mainExtOf(record) {
    var main = textOf(record && record.mainFile).trim();
    if (!main) { return ''; }
    var slash = Math.max(main.lastIndexOf('/'), main.lastIndexOf('\\'));
    var name = slash >= 0 ? main.slice(slash + 1) : main;
    var dot = name.lastIndexOf('.');
    return dot >= 0 ? name.slice(dot + 1).toLowerCase() : '';
  }

  /* 「这条记录能不能显示」= kind 白名单 + 模型主文件扩展名白名单。
     ⚠️ **这是唯一判据入口**（下方 scopedRecords 用它，计数/分类/列表/空态全部派生自那里），
     不要在各处再写一份，否则「列表里没了但计数还在」这种不一致一定会出现。 */
  function isDisplayableRecord(record) {
    if (!record) { return false; }
    if (!isAllowedKind(record.kind)) { return false; }
    if (textOf(record.kind) === 'model') {
      return MODEL_MAIN_EXTS.indexOf(mainExtOf(record)) >= 0;
    }
    return true;
  }

  /* 左栏可见分组：「全部」恒在；其余分组只要它包含任一白名单 kind 才出现。
     ⇒ 放开 HDR 时不用改这里，HDR 分组会自动出现。 */
  function allowedGroups() {
    var out = [];
    for (var i = 0; i < KIND_GROUPS.length; i += 1) {
      var group = KIND_GROUPS[i];
      if (group.key === '') { out.push(group); continue; }
      var hit = false;
      for (var j = 0; j < group.kinds.length; j += 1) {
        if (isAllowedKind(group.kinds[j])) { hit = true; break; }
      }
      if (hit) { out.push(group); }
    }
    return out;
  }

  /* 当前作用域内的记录（kind 白名单 + 模型主文件扩展名白名单过滤后的全量）。
     所有计数 / 分类树 / 卡片 / 空态都从它派生，保证「共 N 项」的 N 与用户能看到的条目一致
     （不会把隐藏的 HDR/CAD 算进去，也不会把 .max 这类 SketchUp 打不开的模型算进去）。 */
  function scopedRecords() {
    var data = state.data;
    if (!data || !data.ok) { return []; }
    var records = data.records || [];
    var out = [];
    for (var i = 0; i < records.length; i += 1) {
      if (isDisplayableRecord(records[i])) { out.push(records[i]); }
    }
    return out;
  }

  /* 「库里 kind=model 但主文件不是 SketchUp 格式」的条数 —— 只给空态文案区分用
     （库里只有 .max 时要说「没有可插入的 SketchUp 模型」，不能说「库为空」）。 */
  function unsupportedModelCount() {
    var data = state.data;
    if (!data || !data.ok) { return 0; }
    var records = data.records || [];
    var count = 0;
    for (var i = 0; i < records.length; i += 1) {
      if (textOf(records[i].kind) === 'model' && !isDisplayableRecord(records[i])) { count += 1; }
    }
    return count;
  }

  /* 这条记录是否属于「双击建材质」的类别（texture / material） */
  function isMaterialRecord(record) {
    if (!record) { return false; }
    return state.materialKinds.indexOf(textOf(record.kind)) >= 0;
  }

  function kindLabelOf(kind) {
    return state.kindLabels[textOf(kind)] || textOf(kind);
  }

  /* 精灵表渲染：复制 #icon-tpl 模板 + 改 use 的 href。
     不用 createElementNS —— 避免在文件里出现命名空间 URL（A3「0 http(s)://」）。 */
  function iconEl(name, sizeClass) {
    var svg = $('icon-tpl').cloneNode(true);
    svg.setAttribute('class', 'icon ' + (sizeClass || ''));
    svg.setAttribute('aria-hidden', 'true');
    var use = svg.querySelector('use');
    use.setAttribute('href', '#' + name);
    return svg;
  }

  function iconForKind(kind) {
    if (kind === 'model') { return 'i-box'; }
    if (kind === 'texture' || kind === 'material') { return 'i-material'; }
    if (kind === 'hdri') { return 'i-hdr'; }
    if (kind === 'cad') { return 'i-cad'; }
    return 'i-other';
  }

  /* ── 撤销胶囊显隐（三态，docs/46 §1.6）───────────────────────────────────
        **唯一**出口。只有 level === 'ok' 才显示并起 5 s 计时；任何其它 level
        （error / warn / info / 空）立刻收起并清计时。连续两次成功 = 先清旧计时再起新的
        ⇒ 覆盖式重新计满 5 s（不会叠出第二个计时器，DOM 里也只有一颗 #undo）。 */
  function updateUndoPill(level) {
    var pill = $('undo');
    if (!pill) { return; }
    if (undoTimer !== null) {
      clearTimeout(undoTimer);
      undoTimer = null;
    }
    if (textOf(level) !== 'ok') {
      pill.classList.add('is-hidden');
      return;
    }
    pill.classList.remove('is-hidden');
    undoTimer = setTimeout(function () {
      undoTimer = null;
      pill.classList.add('is-hidden');
    }, UNDO_PILL_MS);
  }

  /* 用户在浏览/操作面板（重绘、搜索、选中）时不等自然到期，先收起来。
     只是 updateUndoPill 的语义化别名，**不新增第二套显隐逻辑**。 */
  function dismissUndoPill() {
    updateUndoPill('');
  }

  /* ── 状态行（⑥，#status 是 44px 行里的文字节点） ─────────────────────── */
  function setStatus(payload) {
    var node = $('status');
    var message = textOf(payload && payload.message);
    var level = textOf(payload && payload.level) || 'info';
    if (node) {
      node.className = 'status ' + level;
      node.textContent = message;
    }
    /* 签名不变（{message, level}），这里只多这一处联动 */
    updateUndoPill(level);
  }

  /* ── 提示条（③ 索引未开 / IDBOX-101）───────────────────────────────── */
  /* 只读原因按行去重：Ruby 侧两侧（清单 / 内容）各给一句，文案现在两句话完全一致，
     不去重就会在单行提示条里出现「同一句话两遍 ……」被截断，看起来像渲染坏了。 */
  function readOnlyText(data) {
    var raw = textOf(data && data.readOnlyReason);
    if (!raw) { return ''; }
    var lines = raw.split('\n');
    var seen = {};
    var out = [];
    for (var i = 0; i < lines.length; i += 1) {
      var line = lines[i].trim();
      if (!line || seen[line]) { continue; }
      seen[line] = true;
      out.push(line);
    }
    return out.join(' ');
  }

  function renderBanner(data) {
    var banner = $('banner');
    banner.className = 'banner hidden';
    banner.textContent = '';

    if (!data.ok) {
      banner.className = 'banner error';
      banner.appendChild(iconEl('i-alert', 'icon-10'));
      var codeText = textOf(data.codeText);
      if (codeText) {
        banner.appendChild(make('span', 'banner-code', codeText));
        banner.appendChild(document.createTextNode(' · '));
      }
      banner.appendChild(document.createTextNode(textOf(data.message)));
      return;
    }
    if (textOf(data.stateError)) {
      banner.className = 'banner warn';
      banner.appendChild(document.createTextNode(textOf(data.stateError)));
      return;
    }
    if (data.readOnly) {
      banner.className = 'banner warn';
      banner.appendChild(document.createTextNode(readOnlyText(data) || '已切换为只读展示，插入被禁用。'));
    }
  }

  /* ── 灰字备注 ──────────────────────────────────────────────────────── */
  function renderNotes(data) {
    var box = $('notes');
    box.textContent = '';
    var notes = (data && data.notes) ? data.notes : [];
    for (var i = 0; i < notes.length; i += 1) {
      box.appendChild(make('div', 'note', textOf(notes[i])));
    }
    /* 缩略图根未下发 ⇒ 封面只能全部降级成类型图标，用户看到的是「一片图标」却不知道为什么。
       这条提示由**条件**驱动（不是一次性 flag）：下一份 payload 带上 thumbsRoot 就自动消失，
       不会变成常驻噪音。索引不可用时不出这条（那时顶部提示条才是该看的东西）。 */
    if (data && data.ok && thumbRootMissing()) {
      box.appendChild(make('div', 'note note-warn', '缩略图路径没下发——封面降级为类型图标'));
    }
  }

  /* ── 新鲜度 ────────────────────────────────────────────────────────── */
  function freshnessParts(data) {
    var iso = textOf(data && data.generatedAt);
    var parsed = iso ? Date.parse(iso) : NaN;
    if (!iso || isNaN(parsed)) {
      /* P2-1（用户 2026-11-09 拍板）：**界面上不得出现内部字段名**。
         这里原先写「索引时间未知（manifest.generatedAt 缺失）」—— 用户不知道
         manifest.generatedAt 是什么，只会以为软件在报错。改成使用者语言：
         说清「这份索引没带写入时间」，不出现任何字段名。 */
      return { text: '索引时间未知（这份索引没带写入时间）', stale: true };
    }
    var ageSeconds = Math.max(0, Math.round((Date.now() - parsed) / 1000));
    var limit = Number(data.freshnessHintSeconds);
    if (!isFinite(limit) || limit <= 0) { limit = 10; }
    var stale = ageSeconds > limit;
    var readable;
    if (ageSeconds < 60) {
      readable = ageSeconds + ' 秒前';
    } else if (ageSeconds < 3600) {
      readable = Math.round(ageSeconds / 60) + ' 分钟前';
    } else {
      readable = Math.round(ageSeconds / 3600) + ' 小时前';
    }
    var text = '索引更新于 ' + readable;
    if (stale) {
      text += ' · 可能不是最新；点「刷新」重读文件（ID BOX 侧改动需在 ID BOX 里刷新索引）';
    }
    return { text: text, stale: stale };
  }

  function renderFreshness() {
    var data = state.data;
    var node = $('fresh');
    if (!node) { return; }
    if (!data) { return; }
    var parts = freshnessParts(data);
    node.className = parts.stale ? 'fresh stale' : 'fresh';
    node.textContent = parts.text;
    node.title = parts.text;   /* 顶栏单行省略，完整内容走 title */
  }

  /* ── 分类路径 / 禁用原因 ───────────────────────────────────────────── */
  function categoryPath(record) {
    var first = textOf(record.category1);
    var second = textOf(record.category2);
    var parts = [];
    if (first) { parts.push(first); }
    if (second && second !== first) { parts.push(second); }
    if (!parts.length) {
      var folder = textOf(record.relFolder).replace(/\/+$/, '');
      if (folder) { parts.push(folder); }
    }
    return parts.join(' / ') || '（未分类）';
  }

  function unsupportedHintFor(kind) {
    if (kind === 'cad' || kind === 'other') {
      /* 这句会进 card.title 等用户可见位置 ⇒ 只说结论，不提 ALLOWED_KINDS 这类开发常量
         （2026-11-09 A 级文案收口）。 */
      return '这类资产本版不显示（只做模型与材质）';
    }
    return state.unsupportedHint || '这类资产暂不支持插入';
  }

  /* 拦截原因（空串 = 可以动作）。材质的拦截在点击/双击处单独判（动作不同）。 */
  function blockReason(record) {
    var data = state.data || {};
    /* 只读态：说清「禁用了什么动作」+「怎么办」，不出现任何内部字段名与版本数值。
       与 core.rb 的 Messages.api_mismatch 是同一套话术（用户在两处看到一致的说法）。 */
    if (data.readOnly) { return 'ID BOX 与插件版本不匹配，插入已禁用；请把主程序与插件升级到同一版本'; }
    if (isMaterialRecord(record)) { return ''; }
    if (state.insertableKinds.indexOf(textOf(record.kind)) < 0) {
      return unsupportedHintFor(textOf(record.kind));
    }
    if (!textOf(record.mainFile)) { return '该记录没有主文件，无法插入'; }
    return '';
  }

  /* ── ④ 卡片：双轨封面（真实 file:/// 图片 ↔ 内联 SVG 占位）─────────── */
  function encodeSegment(segment) {
    return encodeURIComponent(segment);
  }

  /* ── 封面降级的可诊断性（不碰路径拼装、不加请求，只加「看得见」）───────────
     事故背景：用户装的插件包里 thumbsRoot 恒为 ''，面板静默降级成一片类型图标，
     用户无法自证原因。两条反馈各管一件事：
       ① 根没下发（成因在数据侧）→ 由 renderNotes 的条件提示承担，见上；
       ② 单张图加载失败（成因在加载侧）→ 由下面的合并上报承担。 */

  /* 缩略图根是否未下发。thumbSrc / renderNotes 共用同一个判据，避免两处口径漂移。 */
  function thumbRootMissing() {
    return !textOf(state.thumbsRoot);
  }

  var thumbFailTimer = null;

  /* 封面加载失败上报：400ms 内合并成一条。
     为什么合并：网格常态 100+ 张卡，若 file:/// 整体被拦，逐张 setStatus 会把状态行刷爆，
     反而看不出「全挂了」这件事。合并后单张给具体 src、多张给张数 + 首张 src ——
     有 src 才能分流「file:/// 被 SU 内嵌 CEF 拦住」与「文件真的不存在」。 */
  function noteThumbFailure(src) {
    state.thumbFail += 1;
    if (state.thumbFail === 1) { state.thumbFailFirst = textOf(src); }
    if (thumbFailTimer) { return; }
    thumbFailTimer = setTimeout(function () {
      thumbFailTimer = null;
      var count = state.thumbFail;
      if (count <= 0) { return; }
      var message = (count === 1)
        ? ('封面加载失败：' + state.thumbFailFirst)
        : ('封面加载失败 ' + count + ' 张（首张：' + state.thumbFailFirst + '）');
      setStatus({ message: message, level: 'warn' });
    }, 400);
  }

  function thumbSrc(record) {
    /* 不为空时也不能静默：根未下发是「封面全降级」的唯一已知成因，
       提示由 renderNotes 显示（见上），这里保留显式判据让两处同源。 */
    if (thumbRootMissing()) { return ''; }
    var rel = textOf(record.thumbRel);
    if (!rel) { return ''; }
    var root = textOf(state.thumbsRoot).replace(/\\/g, '/').replace(/\/+$/, '');
    rel = rel.replace(/\\/g, '/').replace(/^\/+/, '');
    if (!root || !rel) { return ''; }

    /* file:/// 不是网络协议；逐段编码以处理中文 / 空格 / # ；盘符段（C:）保留冒号 */
    var out = 'file:///';
    var segments = root.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (i > 0) { out += '/'; }
      out += /^[A-Za-z]:$/.test(segments[i]) ? segments[i] : encodeSegment(segments[i]);
    }
    var relSegments = rel.split('/');
    for (var j = 0; j < relSegments.length; j += 1) {
      out += '/' + encodeSegment(relSegments[j]);
    }
    return out;
  }

  function cardFor(record) {
    var reason = blockReason(record);
    var kind = textOf(record.kind) || 'other';
    var card = make('div', 'card' + (reason ? ' is-disabled' : '') + (state.selectedId === textOf(record.id) ? ' is-selected' : ''));
    card.setAttribute('data-id', textOf(record.id));
    /* 提示语按动作分：模型 = 双击插入；材质/贴图 = 双击建材质（不贴面） */
    var hint = isMaterialRecord(record)
      ? '双击：在当前模型里创建材质并设为当前材质（不会自动贴到任何面上）'
      : '双击插入到当前模型（可 Ctrl+Z 撤销）';
    card.title = reason ? (reason + '\n' + hint) : hint;

    var frame = make('div', 'card-cover-frame');
    var placeholder = make('div', 'card-ph');
    placeholder.appendChild(iconEl(iconForKind(kind), 'icon-40'));

    var src = thumbSrc(record);
    if (src) {
      var img = make('img', 'card-cover');
      img.src = src;
      img.alt = '';
      img.addEventListener('error', function () {
        /* 加载失败 → 隐藏破图、显示同卡内预置的 SVG 占位层 */
        img.className = 'card-cover is-hidden';
        placeholder.className = 'card-ph is-on';
        /* 并且**说出来**：把「file:/// 被 SU 内嵌 CEF 拦截」和「文件不存在」当场分流
           （两者在画面上都是同一片图标，只有 src 能区分）。合并上报，见 noteThumbFailure。 */
        noteThumbFailure(src);
      });
      frame.appendChild(img);
    } else {
      placeholder.className = 'card-ph is-on';
    }

    frame.appendChild(placeholder);
    frame.appendChild(make('span', 'badge', kindLabelOf(kind)));
    card.appendChild(frame);

    var body = make('div', 'card-body');
    body.appendChild(make('div', 'card-name', textOf(record.name) || '（未命名）'));
    var meta = categoryPath(record);
    var files = Number(record.fileCount);
    if (isFinite(files) && files > 0) { meta += ' · ' + files + ' 个文件'; }
    body.appendChild(make('div', 'card-meta', meta));
    card.appendChild(body);

    var check = make('span', 'check-badge');
    check.appendChild(iconEl('i-check', 'icon-10'));
    card.appendChild(check);
    return card;
  }

  /* 记录 → 所属展示分组（跳过聚合项「全部」，否则每条都归 ''，模型/材质计数恒 0）。
     注意 matches() 里 activeKind === '' 表示「不筛选」，走不到这里，语义不受影响。 */
  function groupOf(record) {
    var kind = textOf(record.kind);
    for (var i = 0; i < KIND_GROUPS.length; i += 1) {
      if (KIND_GROUPS[i].all) { continue; }
      if (KIND_GROUPS[i].kinds.indexOf(kind) >= 0) { return KIND_GROUPS[i].key; }
    }
    return 'other';
  }

  /* 纯前端内存过滤：搜索 + 左栏分组 + 一级分类（不请求任何数据）
     第一道就是**显示范围白名单**：HDR/CAD/其他 在这里被挡掉，后续计数与卡片都不会看到它们。 */
  function matches(record) {
    if (!isAllowedKind(record.kind)) { return false; }
    if (state.activeKind && groupOf(record) !== state.activeKind) { return false; }
    if (state.activeCategory1) {
      var category1 = textOf(record.category1).trim();
      if (state.activeCategory1 === UNCLASSIFIED_LABEL) {
        if (!isUnclassified(category1)) { return false; }
      } else if (category1 !== state.activeCategory1) {
        return false;
      }
    }
    if (state.activeCategory2) {
      var category2 = textOf(record.category2).trim();
      if (state.activeCategory2 === UNCLASSIFIED_LABEL) {
        if (!isUnclassified(category2)) { return false; }
      } else if (category2 !== state.activeCategory2) {
        return false;
      }
    }
    var query = state.query.trim().toLowerCase();
    if (!query) { return true; }
    var fields = [textOf(record.name), textOf(record.category1), textOf(record.category2)];
    for (var i = 0; i < fields.length; i += 1) {
      if (fields[i].toLowerCase().indexOf(query) >= 0) { return true; }
    }
    return false;
  }

  function visibleRecords() {
    if (!state.data || !state.data.ok) { return []; }
    var records = scopedRecords();
    var shown = [];
    for (var i = 0; i < records.length; i += 1) {
      if (matches(records[i])) { shown.push(records[i]); }
    }
    if (state.sortKey === 'name') {
      shown.sort(function (a, b) { return textOf(a.name).localeCompare(textOf(b.name)); });
    } else if (state.sortKey === 'category1') {
      shown.sort(function (a, b) { return textOf(a.category1).localeCompare(textOf(b.category1)); });
    } else if (state.sortKey === 'fileCount') {
      shown.sort(function (a, b) { return Number(b.fileCount) - Number(a.fileCount); });
    }
    return shown;
  }

  /* ── ⑤ 空态两态：图形与 DOM 各自不同，互不覆盖 ─────────────────────── */
  function renderEmpty(shown) {
    var empty = $('empty');
    empty.textContent = '';
    var data = state.data;

    if (!data) {
      /* ④ 加载中：首帧到首份 payload 之间不误报「库为空 / 筛选 0」 */
      empty.className = 'empty';
      empty.appendChild(make('div', 'empty-lead', '正在读取索引…'));
      return;
    }
    if (!data.ok) {
      empty.className = 'empty';
      empty.appendChild(iconEl('i-empty-library', 'icon-40'));
      empty.appendChild(make('div', 'empty-text', '索引不可用，处理办法见上方提示条。'));
      return;
    }

    /* ①② 都以**白名单过滤后**的记录为准：HDR / CAD / DALL·E 之类不在 ALLOWED_KINDS 里的大类、
       以及主文件不是 SketchUp 格式的模型（.max 之类），既不参与「共 N 项」，
       也不触发「库为空」的误导文案。 */
    var records = scopedRecords();
    if (records.length === 0) {
      var all = (state.data && state.data.records) ? state.data.records.length : 0;
      var otherModels = unsupportedModelCount();
      empty.className = 'empty';
      empty.appendChild(iconEl('i-empty-library', 'icon-40'));
      if (otherModels > 0) {
        /* ①c 库里有模型，但都不是 SketchUp 能打开的格式（例如只有 3ds Max 文件）：
           必须和「库为空」区分开 —— 否则用户会以为自己没导入成功。
           ⚠️ 文案里不写具体扩展名（避免用黑名单措辞引导后来者改判据），只说"其它格式"。 */
        empty.appendChild(make('div', 'empty-lead', '没有可插入的 SketchUp 模型'));
        empty.appendChild(make('div', 'empty-text', '这些模型不是 SketchUp 格式（例如 3ds Max），插件里不显示。\n请在 ID BOX 里换成 SketchUp 模型，或先另存 / 转换一份。'));
      } else if (all > 0) {
        /* ①b 库里有资产，但本版不显示这些大类 */
        empty.appendChild(make('div', 'empty-lead', '本版只显示模型与材质'));
        empty.appendChild(make('div', 'empty-text', '库里暂时没有模型或材质资产。\nHDR / CAD / D5A 本版不显示。'));
      } else {
        /* ①a 库为空 */
        empty.appendChild(make('div', 'empty-lead', '库为空'));
        empty.appendChild(make('div', 'empty-text', '请在 ID BOX 里导入素材并开启插件索引，\n然后回到这里点「刷新」。'));
      }
      return;
    }
    if (shown === 0) {
      /* ② 筛选 0：搜索框与已输入词保留，不被全局空态盖掉 */
      empty.className = 'empty';
      empty.appendChild(iconEl('i-empty-filter', 'icon-40'));

      /* 空态文案按「为什么空」分支：查询词优先，其次分类筛选。
         ⚠️ 分类筛选时 query 是空的，直接拼会显示「没有匹配「」」。 */
      var q = state.query.trim();
      var hasFilter = !!(state.activeKind || state.activeCategory1 || state.activeCategory2);
      if (q) {
        empty.appendChild(make('div', 'empty-lead', '没有匹配「' + q + '」的记录'));
        empty.appendChild(make('div', 'empty-text', '换个关键词，或点下方「清除筛选」回到全部。'));
      } else if (hasFilter) {
        empty.appendChild(make('div', 'empty-lead', '这个筛选下没有素材'));
        empty.appendChild(make('div', 'empty-text', '换个分类，或点下方「清除筛选」回到全部。'));
      } else {
        empty.appendChild(make('div', 'empty-lead', '没有可显示的素材'));
        empty.appendChild(make('div', 'empty-text', '在 ID BOX 里导入素材后，回到这里点「刷新」。'));
      }

      /* 出口：只有「有东西可清」时才给按钮（q 或分类筛选）。复用 .chip 既有样式，不新造颜色。
         出口把搜索词也一并清掉 —— 否则 q 非空时点它只清分类，空态文案不会变，看起来像按钮坏了。 */
      if (q || hasFilter) {
        var clearBtn = make('button', 'chip chip-ghost', '清除筛选');
        clearBtn.type = 'button';
        clearBtn.setAttribute('data-role', 'empty-clear');
        empty.appendChild(clearBtn);
      }
      return;
    }
    empty.className = 'empty hidden';
  }

  function renderList() {
    var list = $('list');
    list.textContent = '';
    list.className = 'grid' + (state.viewMode === 'list' ? ' view-list' : '');

    /* 每轮重绘重置失败计数：上一次渲染的失败不能被算进这一轮（否则张数会虚高） */
    state.thumbFail = 0;
    state.thumbFailFirst = '';

    var data = state.data;
    if (!data) { renderEmpty(0); return; }

    var shown = 0;
    var visible = visibleRecords();
    for (var i = 0; i < visible.length; i += 1) {
      list.appendChild(cardFor(visible[i]));
      shown += 1;
    }
    renderEmpty(shown);
  }

  function renderCount() {
    var node = $('count');
    if (!node) { return; }
    var data = state.data;
    if (!data || !data.ok) { node.textContent = '—'; return; }
    /* 口径 = 白名单过滤后的记录数（用户看到的「共 N 项」就是他能翻到的条数） */
    var records = scopedRecords();
    var shown = visibleRecords().length;
    node.textContent = (shown === records.length)
      ? ('共 ' + records.length + ' 项')
      : ('共 ' + shown + ' / ' + records.length + ' 项');
  }

  /* ── ② 左栏 + ③ chips ─────────────────────────────────────────────── */
  function groupCounts() {
    var counts = {};
    var records = scopedRecords();
    /* 聚合项「全部」的计数 = 作用域内总数（它不对应具体 kind，不能靠 groupOf 统计） */
    counts[''] = records.length;
    for (var i = 0; i < records.length; i += 1) {
      var key = groupOf(records[i]);
      counts[key] = (counts[key] || 0) + 1;
    }
    return counts;
  }

  /* 一级分类（2026-11-09 用户实测反馈后的口径，对齐 ID BOX 本体 Sidebar.tsx:407-429）：
       · **只在选中某个大类之后才出现**（本体：`l1Nodes = openKind ? countLevel1(...) : []`）；
         「全部」是"大类的上一层"，此时**一行一级分类都不渲染**；
       · 计数范围 = **该大类自己的记录**（本体 countLevel1(activeAssets, openScope)），
         绝不跨类合并 —— 之前这里用全量 scopedRecords 统计，导致「全部」下把模型的
         灯具/软装陈设/家具 和材质的 木纹/涂料/瓷砖 混成一张表（用户原话：「一级分类可是
         模型和材质混杂在一起的哟」）；
       · 材质分组 = texture + material，由 groupOf 把两类都归到 'material' 天然合并计数。
     返回 [{ name, count }]，count 降序、「未分类」恒最后。

     三级分类（2026-11-10 用户要求「1 级 / 2 级菜单的触发改成和 ID BOX 主软件一样」）：
       · 与 Sidebar.tsx:928-1133 同构：点大类展开一级树，点一级 = 筛到该一级并展开其二级树，
         点二级 = 再筛到 category2，再点取消二级且一级保持不变；分类导航只在左栏。
       · 渐进披露（D05 定稿 B）：只为有 ≥1 个真实二级值的一级渲染展开箭头与二级行；
         '未分类' 哨兵不算真实值，二级层不得生成「未分类」节点（isUnclassified() 剔除）。
       · 计数范围 = 当前大类 / 当前一级，且必须走 scopedRecords()（显示范围白名单），不跨类、不跨层。
       · state.activeCategory2 与 state.expandedL1 只由 commit() 写入（T02 落地）。
       · 一级层「未分类」= 空值或 '未分类' 哨兵，走 isUnclassified()，节点保留且可点。
       · 二级值已实测充足（可见作用域 103 条 / 真实二级 85 条 / 38 个不同值 / 19 个一级中
         10 个 ≥2、5 个 ==1、4 个 ==0），本树不是空壳。
       ⚠️ 旧结论「只做到一级分类，这是有意的取舍、不是漏做」（2026-11-09 team-lead 拍板）
          已于 2026-11-10 **废止**：勿再据此删二级树；实现由 T02 / T03 串行落地，本轮 T01
          只更正注释、不动分类逻辑。

     「未分类」节点**保留且可点**（2026-11-09 team-lead 拍板）：本体也是这样，
       点它筛出 category1 为空的那批（`matches()` 里对 UNCLASSIFIED_LABEL 走特判）。 */
  function groupRecords(key) {
    var records = scopedRecords();
    var groupKey = textOf(key);
    if (!groupKey) { return []; }
    var out = [];
    for (var i = 0; i < records.length; i += 1) {
      if (groupOf(records[i]) === groupKey) { out.push(records[i]); }
    }
    return out;
  }

  function topCategories(kindKey) {
    /* kindKey 省略 ⇒ 用当前选中的大类；显式传 '' ⇒ 明确要「全部」作用域（= 空列表） */
    var key = (kindKey === undefined) ? state.activeKind : textOf(kindKey);
    if (!key) { return []; }

    var records = groupRecords(key);
    var counts = {};
    for (var i = 0; i < records.length; i += 1) {
      var first = textOf(records[i].category1).trim();
      var name = first || UNCLASSIFIED_LABEL;
      counts[name] = (counts[name] || 0) + 1;
    }
    var list = [];
    for (var label in counts) {
      if (Object.prototype.hasOwnProperty.call(counts, label)) { list.push({ name: label, count: counts[label] }); }
    }
    list.sort(function (a, b) {
      if (a.name === UNCLASSIFIED_LABEL) { return 1; }
      if (b.name === UNCLASSIFIED_LABEL) { return -1; }
      if (b.count !== a.count) { return b.count - a.count; }
      return a.name.localeCompare(b.name);
    });
    return list;
  }

  /* 某个大类 + 某个一级下，真实存在的二级值（含计数）。
     排序沿用 topCategories 的口径：未分类恒最后、其余按计数降序、同数按名称。
     ⚠️ 聚合范围必须是当前大类 + 当前一级，不能全库 —— 模型侧和材质侧的二级值不重叠，
        跨类聚合会造出「点进去 0 条」的假节点。 */
  function secondCategories(kindKey, category1) {
    var key = (kindKey === undefined) ? state.activeKind : textOf(kindKey);
    var l1 = textOf(category1).trim();
    if (!key || !l1) { return []; }

    var records = groupRecords(key);
    var counts = {};
    for (var i = 0; i < records.length; i += 1) {
      var row = records[i];
      if (textOf(row.category1).trim() !== l1) { continue; }
      var raw = textOf(row.category2).trim();
      /* 关键：哨兵不生成二级节点，否则会多出一个叫「未分类」的假分类 */
      if (isUnclassified(raw)) { continue; }
      counts[raw] = (counts[raw] || 0) + 1;
    }

    var list = [];
    for (var label in counts) {
      if (Object.prototype.hasOwnProperty.call(counts, label)) {
        list.push({ name: label, count: counts[label] });
      }
    }
    list.sort(function (a, b) {
      if (b.count !== a.count) { return b.count - a.count; }
      return a.name.localeCompare(b.name);
    });
    return list;
  }

  function renderSide() {
    var nav = $('side-nav');
    var tree = $('side-tree');
    nav.textContent = '';
    tree.textContent = '';

    var counts = groupCounts();
    var data = state.data;

    /* 只渲染白名单覆盖到的分组 ⇒ HDR / CAD / 其他 三个 nav 项**完全不出现**（不是置灰） */
    var groups = allowedGroups();
    for (var i = 0; i < groups.length; i += 1) {
      var group = groups[i];
      var item = make('div', 'nav-item' + (state.activeKind === group.key ? ' is-active' : ''));
      item.setAttribute('data-kind', group.key);
      item.appendChild(iconEl(group.icon, 'icon-nav'));
      item.appendChild(make('span', null, group.label));
      item.appendChild(make('span', 'nav-count', counts[group.key] || 0));
      nav.appendChild(item);
    }

    var categories = topCategories();
    /* 「一级分类」这个分组标题也只在有内容时出现 —— 选「全部」时它不该占一行空白 */
    var head = document.querySelector('[data-role="l1-head"]');
    if (head) { head.hidden = categories.length === 0; }
    tree.hidden = categories.length === 0;
    for (var j = 0; j < categories.length; j += 1) {
      var cat = categories[j];
      var isL1Active = state.activeCategory1 === cat.name;
      var isOpen = state.expandedL1 === cat.name;

      var row = make('div', 'tree-item' + (isL1Active ? ' is-active' : ''));
      row.setAttribute('data-category', cat.name);
      row.setAttribute('data-row-depth', '1');
      row.appendChild(iconEl('i-folder', 'icon-nav'));
      row.appendChild(make('span', null, cat.name));
      row.appendChild(make('span', 'nav-count', cat.count));

      /* 只有「有 ≥1 个真实二级值」的一级才画展开箭头（渐进披露） */
      var children = secondCategories(state.activeKind, cat.name);
      if (children.length > 0) {
        var caret = make('span', 'tree-caret', isOpen ? '▾' : '▸');
        row.appendChild(caret);
        row.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      }
      tree.appendChild(row);

      if (isOpen && children.length > 0) {
        for (var k = 0; k < children.length; k += 1) {
          var sub = children[k];
          var subRow = make('div', 'tree-item tree-item-l2' +
            (state.activeCategory2 === sub.name ? ' is-active' : ''));
          subRow.setAttribute('data-category2', sub.name);
          subRow.setAttribute('data-row-depth', '2');
          subRow.appendChild(make('span', null, sub.name));
          subRow.appendChild(make('span', 'nav-count', sub.count));
          tree.appendChild(subRow);
        }
      }
    }

    var libPath = $('lib-path');
    libPath.textContent = (data && textOf(data.libraryRoot)) || '（库路径未知）';
    libPath.title = libPath.textContent;
    var version = $('side-version');
    var info = versionInfo(data);
    version.textContent = (info.primary ? 'v' + info.primary : '—') + ' · 本地库';
    version.title = info.title;
  }

  /* 版本号口径（用户 2026-11-09：插件版本号必须与 ID BOX 本体一致）：
     **显示 appVersion**（payload.appVersion ← manifest.appVersion ← 主进程 app.getVersion()
     ← package.json.version）—— 同一来源、运行期自动同步，插件侧不写死第二份。
     pluginVersion 只在 appVersion 缺失时兜底（老索引 / 手写 manifest）。 */
  function versionInfo(data) {
    var app = textOf(data && data.appVersion).trim();
    var plugin = textOf(data && data.pluginVersion).trim();
    var primary = app || plugin;
    var title = [];
    if (app) { title.push('ID BOX 本体 v' + app); }
    if (plugin) { title.push('插件包 v' + plugin); }
    return { primary: primary, title: title.join(' · ') };
  }

  function renderChips() {
    var chips = $('chips');
    /* #count 是必保留 id 的静态节点：先取出，清空后重新挂回行右侧 */
    var countNode = $('count');
    chips.textContent = '';

    var all = make('button', 'chip' + (state.activeKind === '' && state.activeCategory1 === '' && state.activeCategory2 === '' ? ' chip-accent' : ' chip-ghost'), '清除筛选');
    all.type = 'button';
    all.setAttribute('data-chip', 'reset');
    chips.appendChild(all);

    /* T03 第 7 步（D04）：type / category 两颗假 chip 已删——分类入口在左栏树里，
       chips 无浮层、靠点击循环切换的降级方案对分类已无意义。这里只剩「清除筛选」+「排序」。 */
    var sortChip = make('button', 'chip chip-ghost' + (state.sortKey !== 'default' ? ' is-active' : ''));
    sortChip.type = 'button';
    sortChip.setAttribute('data-chip', 'sort');
    sortChip.appendChild(document.createTextNode(SORT_LABELS[state.sortKey] || '排序'));
    chips.appendChild(sortChip);

    /* 「共 N 项」用 #count（§4.1 必保留 id），挂在 chips 行右侧 */
    if (countNode) { chips.appendChild(countNode); }
  }

  function groupLabel(key) {
    for (var i = 0; i < KIND_GROUPS.length; i += 1) {
      if (KIND_GROUPS[i].key === key) { return KIND_GROUPS[i].label; }
    }
    return key;
  }

  /* ── 动作 ────────────────────────────────────────────────────────── */
  function insertRecord(id) {
    if (!hasSketchupCallback('insertRecord')) {
      setStatus({ message: '面板未连接到 SketchUp（回调不可用），请重开面板。', level: 'error' });
      return;
    }
    setStatus({ message: '正在插入…', level: 'info' });
    window.sketchup.insertRecord(id);
  }

  function refreshIndex() {
    if (!hasSketchupCallback('refreshIndex')) {
      setStatus({ message: '面板未连接到 SketchUp（回调不可用），请重开面板。', level: 'error' });
      return;
    }
    setStatus({ message: '正在重新读取索引…', level: 'info' });
    window.sketchup.refreshIndex();
  }

  /* 双击材质：请 Ruby 建材质并设为当前材质（**不贴面**，docs/48 §6）。
     真正的结果由 Ruby 通过 window.IDBOX.setStatus 回填（成功 / 半成功 / 失败都有文案）。 */
  function applyMaterial(id) {
    if (!hasSketchupCallback('applyMaterial')) {
      setStatus({ message: '面板未连接到 SketchUp（回调不可用），请重开面板。', level: 'error' });
      return;
    }
    setStatus({ message: '正在创建材质…', level: 'info' });
    window.sketchup.applyMaterial(id);
  }

  /* ── 自绘窗口控件：折叠 / 关闭（docs/48 §6，只有两个按钮）──────────────
     折叠 = 页面切到 .is-collapsed（只留窄栏）+ 请 Ruby 把窗口 set_size 到 60px。
     顺序很重要：先切样式再改窗口尺寸，收缩过程中不会出现「内容被压扁」的一帧；
     展开相反：先改窗口尺寸再切样式，避免「窗口还没变大就把内容画出来」。 */
  function applyCollapsedClass(collapsed) {
    var cls = 'is-collapsed';
    var nodes = [document.documentElement, document.body];
    for (var i = 0; i < nodes.length; i += 1) {
      if (collapsed) { nodes[i].classList.add(cls); } else { nodes[i].classList.remove(cls); }
    }
    var btn = $('win-fold');
    var use = btn.querySelector('use');
    if (use) { use.setAttribute('href', collapsed ? '#i-expand' : '#i-collapse'); }
    btn.title = collapsed ? '展开面板（恢复完整界面）' : '折叠为窄条（省屏幕空间）';
    btn.setAttribute('aria-label', collapsed ? '展开面板' : '折叠面板');
  }

  function setCollapsed(collapsed) {
    var next = collapsed ? true : false;
    if (next === state.collapsed) { return; }
    state.collapsed = next;
    if (next) {
      applyCollapsedClass(true);
      requestPanelSize(true);
    } else {
      requestPanelSize(false);
      applyCollapsedClass(false);
    }
  }

  function requestPanelSize(collapsed) {
    if (!hasSketchupCallback('setPanelSize')) {
      /* Ruby 没接线时不能静默：页面已折叠但窗口没缩，用户会以为按钮坏了 */
      setStatus({ message: '窗口尺寸回调不可用，折叠只改了页面布局（未改窗口大小）。', level: 'warn' });
      return;
    }
    window.sketchup.setPanelSize(collapsed ? true : false);
  }

  function applyQuery(value) {
    var query = textOf(value);
    /* DOM 部分保留原样：输入框 value 由调用方单独设（input 事件的 target / clear 点击里置空），
       这里只管「清空按钮」显隐 + 写 state + 按矩阵重绘。 */
    $('clear').className = query ? 'clear' : 'clear hidden';
    dismissUndoPill();     /* 搜索属于「用户在浏览」⇒ 不用等 5 s 自然收 */
    commit({ query: query }, 'query');
  }

  /* ⑤ 选中：与插入是同一次 click（单值 state.selectedId） */
  function selectCard(id) {
    state.selectedId = textOf(id);
    dismissUndoPill();     /* 选中新卡＝新的操作意图，旧的成功提示立刻让位 */
    var list = $('list');
    var cards = list.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i += 1) {
      cards[i].className = cards[i].className.replace(/\s*is-selected/, '') + (cards[i].getAttribute('data-id') === state.selectedId ? ' is-selected' : '');
    }
  }

  /* ── 对 Ruby 暴露的入口 ──────────────────────────────────────────── */
  function render(data) {
    state.data = data || null;
    /* 每次整份数据重绘（首开 ready / 手动刷新 / 轮询发现索引变化）都收起胶囊：
       旧的成功提示不该跨一次「重新读索引」继续显示。 */
    dismissUndoPill();
    state.kindLabels = (data && data.kindLabels) ? data.kindLabels : {};
    state.insertableKinds = (data && data.insertableKinds) ? data.insertableKinds : ['model'];
    state.materialKinds = (data && data.materialKinds) ? data.materialKinds : MATERIAL_KINDS;
    state.unsupportedHint = (data && data.unsupportedInsertHint) ? data.unsupportedInsertHint : '';
    state.thumbsRoot = (data && data.thumbsRoot) ? String(data.thumbsRoot) : '';
    var info = versionInfo(data);
    $('ver').textContent = info.primary ? ('v' + info.primary) : '';
    $('ver').title = info.title;
    renderBanner(data || { ok: false, message: '没有数据' });
    renderNotes(data);
    renderFreshness();
    /* 整份数据重绘 = 四区全亮：走 commit(null, 'reset')，不再手抄四件套 */
    commit(null, 'reset');
  }

  window.IDBOX = {
    render: render,
    setStatus: setStatus
  };

  /* ── 预览密度（大 / 中 / 小）────────────────────────────────────────────
     三档 = 网格 2 / 3 / 4 列（CSS：body.density-* 上的 --grid-cols）。
     持久化**只**用 localStorage（面板里唯一允许的持久化，绝不写盘文件）；
     file:// 或隐私模式下 localStorage 可能直接抛异常 ⇒ 全部 try/catch，
     读不到就退回默认「中」，存不了只影响下次启动。 */
  var DENSITY_KEY = 'idbox.panel.density';
  var DENSITY_VALUES = ['lg', 'md', 'sm'];

  function normalizeDensity(value) {
    return DENSITY_VALUES.indexOf(textOf(value)) >= 0 ? textOf(value) : 'md';
  }

  function readDensity() {
    try {
      return normalizeDensity(window.localStorage.getItem(DENSITY_KEY));
    } catch (error) {
      return 'md';
    }
  }

  /* 只动 body 的 class 与三个按钮的状态，不重绘网格（列数由 CSS 变量驱动） */
  function applyDensity(value) {
    var next = normalizeDensity(value);
    state.density = next;
    var body = document.body;
    body.classList.remove('density-lg', 'density-md', 'density-sm');
    body.classList.add('density-' + next);
    var buttons = document.querySelectorAll('.density-btn');
    for (var i = 0; i < buttons.length; i += 1) {
      var on = buttons[i].getAttribute('data-density') === next;
      buttons[i].className = 'density-btn' + (on ? ' is-active' : '');
      buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    return next;
  }

  function setDensity(value) {
    var next = applyDensity(value);
    try {
      window.localStorage.setItem(DENSITY_KEY, next);
    } catch (error) {
      /* 存不了不影响本次会话 */
    }
  }

  /* ── 事件绑定（事件委托）──────────────────────────────────────────── */
  $('q').addEventListener('input', function (event) {
    applyQuery(event.target.value);
  });
  $('clear').addEventListener('click', function () {
    $('q').value = '';
    applyQuery('');
    $('q').focus();
  });
  $('refresh').addEventListener('click', function () { refreshIndex(); });
  $('banner').addEventListener('click', function () { refreshIndex(); });   /* P1-2：可点击提示条 */

  /* T03 第 9 步：空态里的「清除筛选」出口（事件绑在 #empty 上，用 closestWithAttr 找）。
     ⚠️ commit 只写 state，不负责输入框的 value —— 搜索词必须在这里显式清 DOM，
     与「清空搜索」按钮（#clear）同款处理，否则输入框里残留旧词而列表已回到全部。 */
  $('empty').addEventListener('click', function (event) {
    var btn = closestWithAttr(event.target, 'data-role');
    if (!btn || btn.getAttribute('data-role') !== 'empty-clear') { return; }
    $('q').value = '';
    $('clear').className = 'clear hidden';
    commit({
      query: '', activeKind: '', activeCategory1: '', activeCategory2: '',
      expandedL1: '', sortKey: 'default'
    }, 'reset');
  });

  /* 自绘窗口控件：只剩「折叠」（2026-11-09 B′：关闭交给系统 × / 菜单，不再有自绘关闭按钮） */
  $('win-fold').addEventListener('click', function () { setCollapsed(!state.collapsed); });

  /* 预览密度：大 / 中 / 小（分段控件，toggle 语义 = 点已选中的那档不取消，只是保持） */
  var densityRoot = document.querySelector('[data-role="density"]');
  if (densityRoot) {
    densityRoot.addEventListener('click', function (event) {
      var btn = closestWithAttr(event.target, 'data-density');
      if (!btn) { return; }
      var next = btn.getAttribute('data-density');
      if (next === state.density) { return; }
      setDensity(next);
    });
  }

  /* 从点击事件里找回卡片节点（单击 / 双击共用） */
  function cardFrom(event) {
    var card = event.target;
    var list = $('list');
    while (card && card !== list && !(card.className && card.className.indexOf('card') >= 0 && card.getAttribute('data-id'))) {
      card = card.parentNode;
    }
    if (!card || card === list || !card.getAttribute('data-id')) { return null; }
    return card;
  }

  /* 单击一律只做选中 + 提示，不执行动作（2026-11-11 用户改口径：防误点卡顿）。 */
  $('list').addEventListener('click', function (event) {
    var card = cardFrom(event);
    if (!card) { return; }
    var id = card.getAttribute('data-id');
    selectCard(id);
    var record = findRecord(id);
    if (!record) { return; }
    /* 材质/贴图：单击只做选中 + 提示（真正的动作在双击，见下面 dblclick） */
    if (isMaterialRecord(record)) {
      setStatus({
        message: '双击这张' + kindLabelOf(record.kind) + '：在当前模型里创建材质并设为当前材质（不会自动贴到面上）',
        level: 'info'
      });
      return;
    }
    var reason = blockReason(record);
    if (reason) { setStatus({ message: reason, level: 'warn' }); return; }
    setStatus({
      message: '双击这张' + kindLabelOf(record.kind) + '：插入到当前模型（可 Ctrl+Z 撤销）',
      level: 'info'
    });
  });

  /* 模型与材质都是双击动作（docs/48 §6）；单击只做选中 + 提示
     （2026-11-11 用户改口径：防误点卡顿，原 A14「点一下即插入、不做二次确认」改此）。 */
  $('list').addEventListener('dblclick', function (event) {
    var card = cardFrom(event);
    if (!card) { return; }
    var record = findRecord(card.getAttribute('data-id'));
    if (!record) { return; }
    var data = state.data || {};
    /* 材质/贴图 → 建材质（不贴面） */
    if (isMaterialRecord(record)) {
      if (data.readOnly) {
        setStatus({ message: 'ID BOX 与插件版本不匹配，建材质已禁用；请把主程序与插件升级到同一版本', level: 'warn' });
        return;
      }
      applyMaterial(textOf(record.id));
      return;
    }
    /* 可插入 kind → 插入 */
    var reason = blockReason(record);
    if (reason) { setStatus({ message: reason, level: 'warn' }); return; }
    insertRecord(textOf(record.id));
  });

  function findRecord(id) {
    var data = state.data;
    if (!data || !data.ok) { return null; }
    var records = data.records || [];
    for (var i = 0; i < records.length; i += 1) {
      if (textOf(records[i].id) === textOf(id)) { return records[i]; }
    }
    return null;
  }

  /* 从事件目标往上找「带某个属性的元素」。
     ⚠️ 不能用 `!el.getAttribute(x)` 判存在：`data-kind=""`（「全部」那一项）是**空字符串、
     但属性存在**，旧写法会一直往上爬到 null，于是「全部」点了没反应。 */
  function closestWithAttr(node, attr) {
    var el = node;
    while (el && el.getAttribute) {
      if (el.hasAttribute(attr)) { return el; }
      el = el.parentNode;
    }
    return null;
  }

  /* 左栏大类：点一次展开（显示它自己的一级分类），再点同一个 → 收起回「全部」。
     展开态（= 一级分类树）与本体同构：`activeKind` 非空才有一级分类。 */
  $('side-nav').addEventListener('click', function (event) {
    var item = closestWithAttr(event.target, 'data-kind');
    if (!item) { return; }
    var key = item.getAttribute('data-kind') || '';
    /* 再点当前大类 ⇒ 收起（回到「全部」）；切到别的大类 ⇒ 旧的一级分类必须清掉，
       否则会出现「材质分组 + 灯具」这种空列表（跨类的 category1 不成立）。 */
    commit({
      activeKind: (key !== '' && key === state.activeKind) ? '' : key,
      /* 换大类 ⇒ 旧的一级/二级不再属于当前范围；清场点必须三字段一起清 */
      activeCategory1: '',
      activeCategory2: '',
      expandedL1: ''
    }, 'kind');
  });

  $('side-tree').addEventListener('click', function (event) {
    /* 先看是不是二级（二级行同时带 data-category2） */
    var sub = closestWithAttr(event.target, 'data-category2');
    if (sub) {
      var c2 = sub.getAttribute('data-category2') || '';
      /* 再点同一条 = 取消二级；一级保持不变 */
      commit({ activeCategory2: (c2 === state.activeCategory2) ? '' : c2 }, 'category2');
      return;
    }

    var item = closestWithAttr(event.target, 'data-category');
    if (!item) { return; }
    var name = item.getAttribute('data-category') || '';
    var same = (name === state.activeCategory1);

    commit({
      activeCategory1: same ? '' : name,
      /* 点一级 = 筛选 + 展开它的二级；再点同一个一级 = 收起并清二级 */
      expandedL1: same ? '' : name,
      activeCategory2: ''
    }, 'category1');
  });

  /* chips 无浮层（React 能力），降级为点击循环切换，三态 class 保留 */
  $('chips').addEventListener('click', function (event) {
    var chip = event.target;
    while (chip && !chip.getAttribute('data-chip')) { chip = chip.parentNode; }
    if (!chip) { return; }
    var which = chip.getAttribute('data-chip');
    if (which === 'reset') {
      commit({
        activeKind: '', activeCategory1: '', activeCategory2: '',
        expandedL1: '', sortKey: 'default'
      }, 'reset');
      return;
    }
    /* T03 第 7 步（D04）：which === 'type' / 'category' 两个分支已随两颗假 chip 一起删除；
       chips 只剩「清除筛选」与「排序」。nextIn 仍被 sort 使用，保留。 */
    if (which === 'sort') {
      commit({ sortKey: nextIn(SORT_KEYS, state.sortKey) }, 'sort');
    }
  });

  function nextIn(list, current) {
    var index = list.indexOf(current);
    return list[(index + 1) % list.length];
  }

  /* 重绘矩阵：哪些原因需要重绘哪些区域。true = 重绘。
     原则：改筛选 → 左栏高亮 + chips + 列表 + 计数都要变；
           改排序 → 只影响列表顺序，不动左栏和计数；
           改搜索词 → 只影响列表和计数。 */
  var REDRAW_MATRIX = {
    kind:     { side: true,  chips: true,  list: true,  count: true },
    category1:{ side: true,  chips: true,  list: true,  count: true },
    category2:{ side: true,  chips: true,  list: true,  count: true },
    sort:     { side: false, chips: true,  list: true,  count: false },
    query:    { side: false, chips: false, list: true,  count: true },
    reset:    { side: true,  chips: true,  list: true,  count: true },
    density:  { side: false, chips: false, list: true,  count: false },
    view:     { side: false, chips: false, list: true,  count: false },
    select:   { side: false, chips: false, list: false, count: false }
  };

  /* 唯一的 state 写入入口。patch 里放要改的字段，reason 决定重绘范围。 */
  function commit(patch, reason) {
    if (patch) {
      for (var key in patch) {
        if (Object.prototype.hasOwnProperty.call(patch, key)) {
          state[key] = patch[key];
        }
      }
    }
    var plan = REDRAW_MATRIX[reason] || REDRAW_MATRIX.reset;
    if (plan.side) { renderSide(); }
    if (plan.chips) { renderChips(); }
    if (plan.list) { renderList(); }
    if (plan.count) { renderCount(); }
  }

  /* 分段控件：仅切换网格 / 单列展示（卡片 markup 不变） */
  document.querySelector('.seg').addEventListener('click', function (event) {
    var btn = event.target;
    while (btn && !btn.getAttribute('data-view')) { btn = btn.parentNode; }
    if (!btn) { return; }
    commit({ viewMode: btn.getAttribute('data-view') }, 'view');
    var buttons = document.querySelectorAll('.seg-btn');
    for (var i = 0; i < buttons.length; i += 1) {
      buttons[i].className = 'seg-btn' + (buttons[i].getAttribute('data-view') === state.viewMode ? ' is-active' : '');
    }
  });

  /* ESC：折叠态下先展开（用户下意识按 Esc 想退出窄条）；
     否则沿用「取消 chips 筛选」语义。 */
  document.addEventListener('keydown', function (event) {
    var key = textOf(event && event.key);
    if (key !== 'Escape' && key !== 'Esc') { return; }
    if (state.collapsed) {
      setCollapsed(false);
      setStatus({ message: '已展开面板（Esc）', level: 'info' });
      return;
    }
    if (!state.activeKind && !state.activeCategory1 && !state.activeCategory2 && state.sortKey === 'default') { return; }
    commit({
      activeKind: '', activeCategory1: '', activeCategory2: '',
      expandedL1: '', sortKey: 'default'
    }, 'reset');
    setStatus({ message: '已取消筛选（Esc）', level: 'info' });
  });

  /* 新鲜度每 5 s 自刷新一次显示（纯本地计算，不请求任何数据） */
  setInterval(renderFreshness, 5000);

  /* 预览密度初值：先按记忆值把 body class 与按钮态摆好，再渲染列表
     （列数由 CSS 变量决定，首帧就是用户上次选的那档，不会先闪一下 3 列） */
  applyDensity(readDensity());

  /* 初始化也走 commit：四件套只允许出现在 commit 内部（§2.3 判据 1）。
     reason = 'reset' ⇒ 四区全亮，与改之前逐区一致。 */
  commit(null, 'reset');

  /* 折叠态图标初值（展开态 = 折叠图标 + 对应的 title / aria-label） */
  applyCollapsedClass(false);

  /* 面板就绪：请 Ruby 推第一份数据 */
  if (hasSketchupCallback('ready')) {
    window.sketchup.ready();
  } else {
    setStatus({ message: '面板未连接到 SketchUp（回调不可用），请从「扩展 → ID BOX 资产面板」重开。', level: 'error' });
  }
}());
</script>
</body>
</html>
