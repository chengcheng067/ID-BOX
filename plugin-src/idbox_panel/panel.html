<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ID BOX</title>
<!--
  ID BOX · SketchUp 面板（本地文件，UI::HtmlDialog#set_file 加载）

  硬约束（docs/39 §4.1，改这个文件时不得放开）：
    - 零网络：不允许任何 http(s) 请求、CDN、外链字体/图片、XHR/fetch/WebSocket。
      所有样式与脚本都在这一个文件里内联。
    - 零上报：不打点、不写 cookie、不用 localStorage 传数据。
    - 搜索过滤纯前端：只在内存里过滤 Ruby 推下来的记录。
    - 只读：面板从不调用任何写文件的 Ruby 回调（Ruby 侧也没有这样的回调）。

  与 Ruby 的契约（main.rb 注册的 add_action_callback）：
    sketchup.ready()                → 面板就绪，请求数据
    sketchup.refreshIndex()         → 强制重读索引文件
    sketchup.insertRecord(id)       → 插入一条记录
  Ruby 侧调用（execute_script）：
    window.IDBOX.render(payload)    → 渲染整份数据
    window.IDBOX.setStatus(obj)     → 底部状态行 { message, level }
-->
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e3e6ec;
    --text: #1f2430;
    --text-dim: #6b7280;
    --text-faint: #98a1b0;
    --accent: #2563eb;
    --accent-soft: #eaf0ff;
    --ok: #15803d;
    --warn: #b45309;
    --warn-soft: #fff8e6;
    --err: #b91c1c;
    --err-soft: #fdecec;
    --tag-model: #2563eb;
    --tag-texture: #7c3aed;
    --tag-material: #0d9488;
    --tag-hdri: #db2777;
    --tag-cad: #b45309;
    --tag-other: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1e24;
      --panel: #23272f;
      --line: #343a45;
      --text: #e8eaf0;
      --text-dim: #a3abba;
      --text-faint: #7d8697;
      --accent: #6d9bff;
      --accent-soft: #23304f;
      --ok: #4ade80;
      --warn: #fbbf24;
      --warn-soft: #3a2f16;
      --err: #f87171;
      --err-soft: #3d1f1f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* ── 头部 ─────────────────────────────────────────────────────────── */
  .hd { padding: 10px 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .hd-row { display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
  .title .ver { font-weight: 400; letter-spacing: 0; color: var(--text-faint); font-size: 11px; margin-left: 4px; }
  .hd-right { display: flex; align-items: center; gap: 8px; }
  .count { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .btn-ghost {
    border: 1px solid var(--line); background: transparent; color: var(--text-dim);
    font-size: 12px; padding: 3px 9px; border-radius: 5px; cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .fresh { margin-top: 4px; font-size: 11px; color: var(--text-faint); }
  .fresh.stale { color: var(--warn); }

  /* ── 提示区 ───────────────────────────────────────────────────────── */
  .banner {
    margin: 8px 12px 0; padding: 8px 10px; border-radius: 6px;
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
    border: 1px solid transparent;
  }
  .banner.error { background: var(--err-soft); color: var(--err); border-color: var(--err); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .banner .banner-code { font-weight: 700; margin-right: 4px; }
  .notes { padding: 0 12px; }
  .note { font-size: 11px; color: var(--text-faint); padding: 4px 0 0; white-space: pre-wrap; }

  /* ── 搜索 ─────────────────────────────────────────────────────────── */
  .search-wrap { position: relative; padding: 10px 12px 8px; }
  .search {
    width: 100%; padding: 7px 26px 7px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .btn-clear {
    position: absolute; right: 18px; top: 50%; transform: translateY(-40%);
    border: none; background: transparent; color: var(--text-faint);
    font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .btn-clear:hover { color: var(--text); }

  /* ── 列表 ─────────────────────────────────────────────────────────── */
  .list { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 6px; }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; margin-bottom: 4px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { border-color: var(--accent); background: var(--accent-soft); }
  .row.row-disabled { cursor: default; opacity: .62; }
  .row.row-disabled:hover { border-color: var(--line); background: var(--panel); }
  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row-name .name {
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tag {
    flex: 0 0 auto; font-size: 10px; line-height: 1.6; padding: 0 5px;
    border-radius: 3px; color: #fff; letter-spacing: .02em;
  }
  .tag-model { background: var(--tag-model); }
  .tag-texture { background: var(--tag-texture); }
  .tag-material { background: var(--tag-material); }
  .tag-hdri { background: var(--tag-hdri); }
  .tag-cad { background: var(--tag-cad); }
  .tag-other { background: var(--tag-other); }
  .row-path {
    font-size: 11px; color: var(--text-faint); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-insert {
    flex: 0 0 auto; border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-size: 12px; padding: 3px 10px; border-radius: 5px;
    cursor: pointer; font-family: inherit;
  }
  .btn-insert:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .btn-insert:disabled { cursor: not-allowed; border-color: var(--line); color: var(--text-faint); }

  .empty { padding: 24px 16px; text-align: center; color: var(--text-faint); font-size: 12px; white-space: pre-wrap; }

  /* ── 状态行 ───────────────────────────────────────────────────────── */
  .status {
    flex: 0 0 auto; min-height: 26px; padding: 5px 12px;
    border-top: 1px solid var(--line); background: var(--panel);
    font-size: 11px; color: var(--text-dim); white-space: pre-wrap;
    max-height: 74px; overflow-y: auto;
  }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.error { color: var(--err); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="hd-row">
      <div class="title">ID BOX<span id="ver" class="ver"></span></div>
      <div class="hd-right">
        <span id="count" class="count">—</span>
        <button id="refresh" class="btn-ghost" type="button" title="重新读取索引文件（只读，不会改动 ID BOX 数据）">刷新</button>
      </div>
    </div>
    <div id="fresh" class="fresh">正在读取索引…</div>
  </div>

  <div id="banner" class="banner hidden"></div>
  <div id="notes" class="notes"></div>

  <div class="search-wrap">
    <input id="q" class="search" type="text" placeholder="搜索名称 / 分类…" autocomplete="off" spellcheck="false">
    <button id="clear" class="btn-clear hidden" type="button" title="清空搜索">×</button>
  </div>

  <div id="list" class="list"></div>
  <div id="empty" class="empty hidden"></div>
  <div id="status" class="status"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    data: null,
    query: '',
    kindLabels: {},
    insertableKinds: ['model'],
    unsupportedHint: ''
  };

  function $(id) { return document.getElementById(id); }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function textOf(value) {
    return (value === undefined || value === null) ? '' : String(value);
  }

  function hasSketchupCallback(name) {
    return !!(window.sketchup && typeof window.sketchup[name] === 'function');
  }

  /* ── 状态行 ──────────────────────────────────────────────────────── */
  function setStatus(payload) {
    var node = $('status');
    if (!node) { return; }
    var message = textOf(payload && payload.message);
    var level = textOf(payload && payload.level) || 'info';
    node.className = 'status ' + level;
    node.textContent = message;
  }

  /* ── 顶部提示条 ──────────────────────────────────────────────────── */
  function renderBanner(data) {
    var banner = $('banner');
    banner.className = 'banner hidden';
    banner.textContent = '';

    if (!data.ok) {
      banner.className = 'banner error';
      var codeText = textOf(data.codeText);
      if (codeText) {
        banner.appendChild(make('span', 'banner-code', codeText));
        banner.appendChild(document.createTextNode(' · '));
      }
      banner.appendChild(document.createTextNode(textOf(data.message)));
      return;
    }
    if (textOf(data.stateError)) {
      banner.className = 'banner warn';
      banner.appendChild(document.createTextNode(textOf(data.stateError)));
      return;
    }
    if (data.readOnly) {
      banner.className = 'banner warn';
      banner.appendChild(document.createTextNode(textOf(data.readOnlyReason) || '已切换为只读展示，插入被禁用。'));
    }
  }

  /* ── 灰字备注（不占错误码的提示，例如非 ASCII 用户目录） ─────────── */
  function renderNotes(data) {
    var box = $('notes');
    box.textContent = '';
    var notes = (data && data.notes) ? data.notes : [];
    for (var i = 0; i < notes.length; i += 1) {
      box.appendChild(make('div', 'note', textOf(notes[i])));
    }
  }

  /* ── 新鲜度 ──────────────────────────────────────────────────────── */
  function freshnessParts(data) {
    var iso = textOf(data && data.generatedAt);
    var parsed = iso ? Date.parse(iso) : NaN;
    if (!iso || isNaN(parsed)) {
      return { text: '索引时间未知（manifest.generatedAt 缺失）', stale: true };
    }
    var ageSeconds = Math.max(0, Math.round((Date.now() - parsed) / 1000));
    var limit = Number(data.freshnessHintSeconds);
    if (!isFinite(limit) || limit <= 0) { limit = 10; }
    var stale = ageSeconds > limit;
    var readable;
    if (ageSeconds < 60) {
      readable = ageSeconds + ' 秒前';
    } else if (ageSeconds < 3600) {
      readable = Math.round(ageSeconds / 60) + ' 分钟前';
    } else {
      readable = Math.round(ageSeconds / 3600) + ' 小时前';
    }
    var text = '索引更新于 ' + readable;
    if (stale) {
      text += ' · 可能不是最新；点「刷新」重读文件（ID BOX 侧改动需在 ID BOX 里刷新索引）';
    }
    return { text: text, stale: stale };
  }

  function renderFreshness() {
    var data = state.data;
    var node = $('fresh');
    if (!node) { return; }
    if (!data) { return; }
    var parts = freshnessParts(data);
    node.className = parts.stale ? 'fresh stale' : 'fresh';
    node.textContent = parts.text;
  }

  /* ── 行 ──────────────────────────────────────────────────────────── */
  function categoryPath(record) {
    var first = textOf(record.category1);
    var second = textOf(record.category2);
    var parts = [];
    if (first) { parts.push(first); }
    if (second && second !== first) { parts.push(second); }
    if (!parts.length) {
      var folder = textOf(record.relFolder).replace(/\/+$/, '');
      if (folder) { parts.push(folder); }
    }
    return parts.join(' / ') || '（未分类）';
  }

  /* 禁用原因：材质/贴图/HDRI 走「待真机验证」文案（D2 未结）；
     CAD / 其他 与材质无关，另给一句更准确的话，避免误导。 */
  function unsupportedHintFor(kind) {
    if (kind === 'cad' || kind === 'other') {
      return 'V1.0 只支持插入模型（kind = model）；CAD / 其他类型暂不支持';
    }
    return state.unsupportedHint || '材质/贴图取用待真机验证，暂不支持';
  }

  function blockReason(record) {
    var data = state.data || {};
    if (data.readOnly) { return '索引版本与插件不匹配（apiVersion 不是 "1"），插入已禁用'; }
    if (state.insertableKinds.indexOf(textOf(record.kind)) < 0) {
      return unsupportedHintFor(textOf(record.kind));
    }
    if (!textOf(record.mainFile)) { return '该记录没有主文件（mainFile 为空），无法插入'; }
    return '';
  }

  function rowFor(record) {
    var reason = blockReason(record);
    var row = make('div', reason ? 'row row-disabled' : 'row');
    var kind = textOf(record.kind) || 'other';

    var main = make('div', 'row-main');
    var nameLine = make('div', 'row-name');
    nameLine.appendChild(make('span', 'name', textOf(record.name) || '（未命名）'));
    nameLine.appendChild(make('span', 'tag tag-' + kind, state.kindLabels[kind] || kind));
    main.appendChild(nameLine);

    var pathLine = make('div', 'row-path', categoryPath(record));
    pathLine.title = textOf(record.relFolder);
    main.appendChild(pathLine);
    row.appendChild(main);

    var button = make('button', 'btn-insert', '插入');
    button.type = 'button';
    if (reason) {
      button.disabled = true;
      button.title = reason;
      row.title = reason;
    } else {
      button.title = '插入到当前模型（一次操作，可 Ctrl+Z 撤销）';
      row.title = textOf(record.mainFile);
      button.addEventListener('click', function (event) {
        event.stopPropagation();
        insertRecord(record.id);
      });
      row.addEventListener('click', function () { insertRecord(record.id); });
    }
    row.appendChild(button);
    return row;
  }

  function matches(record) {
    var query = state.query.trim().toLowerCase();
    if (!query) { return true; }
    var fields = [textOf(record.name), textOf(record.category1), textOf(record.category2)];
    for (var i = 0; i < fields.length; i += 1) {
      if (fields[i].toLowerCase().indexOf(query) >= 0) { return true; }
    }
    return false;
  }

  function renderList() {
    var list = $('list');
    var empty = $('empty');
    list.textContent = '';
    var data = state.data;

    if (!data) {
      empty.className = 'empty';
      empty.textContent = '正在读取索引…';
      return;
    }
    if (!data.ok) {
      empty.className = 'empty';
      empty.textContent = '索引不可用，处理办法见上方提示。';
      return;
    }
    var records = data.records || [];
    var shown = 0;
    for (var i = 0; i < records.length; i += 1) {
      if (!matches(records[i])) { continue; }
      list.appendChild(rowFor(records[i]));
      shown += 1;
    }
    if (shown === 0) {
      empty.className = 'empty';
      empty.textContent = records.length === 0
        ? '索引里没有记录。\n请在 ID BOX 里刷新索引后回到这里点「刷新」。'
        : '没有匹配「' + state.query.trim() + '」的记录。';
    } else {
      empty.className = 'empty hidden';
      empty.textContent = '';
    }
  }

  function renderCount() {
    var node = $('count');
    if (!node) { return; }
    var data = state.data;
    if (!data || !data.ok) { node.textContent = '—'; return; }
    var shown = 0;
    var records = data.records || [];
    for (var i = 0; i < records.length; i += 1) {
      if (matches(records[i])) { shown += 1; }
    }
    node.textContent = (shown === records.length)
      ? (records.length + ' 条')
      : (shown + ' / ' + records.length + ' 条');
  }

  /* ── 动作 ────────────────────────────────────────────────────────── */
  function insertRecord(id) {
    if (!hasSketchupCallback('insertRecord')) {
      setStatus({ message: '面板未连接到 SketchUp（回调不可用），请重开面板。', level: 'error' });
      return;
    }
    setStatus({ message: '正在插入…', level: 'info' });
    window.sketchup.insertRecord(id);
  }

  function refreshIndex() {
    if (!hasSketchupCallback('refreshIndex')) {
      setStatus({ message: '面板未连接到 SketchUp（回调不可用），请重开面板。', level: 'error' });
      return;
    }
    setStatus({ message: '正在重新读取索引…', level: 'info' });
    window.sketchup.refreshIndex();
  }

  function applyQuery(value) {
    state.query = textOf(value);
    $('clear').className = state.query ? 'btn-clear' : 'btn-clear hidden';
    renderList();
    renderCount();
  }

  /* ── 对 Ruby 暴露的入口 ──────────────────────────────────────────── */
  function render(data) {
    state.data = data || null;
    state.kindLabels = (data && data.kindLabels) ? data.kindLabels : {};
    state.insertableKinds = (data && data.insertableKinds) ? data.insertableKinds : ['model'];
    state.unsupportedHint = (data && data.unsupportedInsertHint) ? data.unsupportedInsertHint : '';
    $('ver').textContent = (data && data.pluginVersion) ? ('v' + data.pluginVersion) : '';
    renderBanner(data || { ok: false, message: '没有数据' });
    renderNotes(data);
    renderFreshness();
    renderList();
    renderCount();
  }

  window.IDBOX = {
    render: render,
    setStatus: setStatus
  };

  /* ── 事件绑定 ────────────────────────────────────────────────────── */
  $('q').addEventListener('input', function (event) {
    applyQuery(event.target.value);
  });
  $('clear').addEventListener('click', function () {
    $('q').value = '';
    applyQuery('');
    $('q').focus();
  });
  $('refresh').addEventListener('click', function () { refreshIndex(); });

  /* 新鲜度每 5 s 自刷新一次显示（纯本地计算，不请求任何数据） */
  setInterval(renderFreshness, 5000);

  renderList();

  /* 面板就绪：请 Ruby 推第一份数据 */
  if (hasSketchupCallback('ready')) {
    window.sketchup.ready();
  } else {
    setStatus({ message: '面板未连接到 SketchUp（回调不可用），请从「扩展 → ID BOX 资产面板」重开。', level: 'error' });
  }
}());
</script>
</body>
</html>
